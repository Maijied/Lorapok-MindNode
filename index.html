<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindNode | Elegant Digital Notepad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f7ff',
                            100: '#eef2ff',
                            200: '#e0e7ff',
                            300: '#c7d2fe',
                            400: '#a5b4fc',
                            500: '#818cf8',
                            600: '#6366f1',
                            700: '#4f46e5',
                            800: '#4338ca',
                            900: '#3730a3',
                        },
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 transition-colors duration-300 font-sans">

    <!-- Auth View -->
    <div id="auth-view" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white dark:bg-zinc-900 rounded-3xl shadow-xl p-8 border border-zinc-200 dark:border-zinc-800 backdrop-blur-sm">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-brand-600 text-white rounded-2xl mb-4 shadow-lg shadow-brand-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.t-1v-5m-1.t-1v-5m-1.t-1v-5" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H5a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1 9h4m-3 0a9 9 0 1118 0 9 9 0 01-18 0z" />
                    </svg>
                </div>
                <h1 class="text-3xl font-bold tracking-tight">Welcome to MindNode</h1>
                <p class="text-zinc-500 dark:text-zinc-400 mt-2">Your thoughts, organized beautifully.</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-1 ml-1">Email Address</label>
                    <input type="email" id="auth-email" required class="w-full px-4 py-3 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-transparent focus:ring-2 focus:ring-brand-500 outline-none transition-all" placeholder="name@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-1 ml-1">Password</label>
                    <input type="password" id="auth-password" required class="w-full px-4 py-3 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-transparent focus:ring-2 focus:ring-brand-500 outline-none transition-all" placeholder="••••••••">
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" id="btn-login" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 rounded-xl transition-all transform active:scale-95 shadow-lg shadow-brand-500/20">Login</button>
                    <button type="button" id="btn-signup" class="flex-1 bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 font-semibold py-3 rounded-xl transition-all transform active:scale-95">Sign Up</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="hidden h-screen flex overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-80 bg-zinc-100 dark:bg-zinc-900 border-r border-zinc-200 dark:border-zinc-800 flex flex-col transition-all duration-300">
            <div class="p-6 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center text-white font-bold text-xs">M</div>
                    <span class="font-bold text-lg">MindNode</span>
                </div>
                <button id="btn-theme-toggle" class="p-2 rounded-lg hover:bg-zinc-200 dark:hover:bg-zinc-800 transition-colors">
                    <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m5.99a10.24 10.24 0 01-1.41 8.41c-.3.52-.78.92-1.41 1.21a10.24 10.24 0 01-14.14 0c-.63-.29-1.11-.69-1.41-1.21a10.24 10.24 0 01-1.41-8.41M12 12a3 3 0 100-6 3 3 0 000 6z" /></svg>
                    <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                </button>
            </div>

            <div class="px-4 mb-6">
                <div class="relative">
                    <input type="text" id="search-notes" class="w-full pl-10 pr-4 py-2 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-800 focus:ring-2 focus:ring-brand-500 outline-none transition-all text-sm" placeholder="Search notes...">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 absolute left-3 top-2.5 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                </div>
            </div>

            <div id="notes-list" class="flex-1 overflow-y-auto px-3 space-y-2 pb-6">
                <!-- Notes will be injected here -->
                <div class="animate-pulse space-y-2">
                    <div class="h-16 bg-zinc-200 dark:bg-zinc-800 rounded-xl"></div>
                    <div class="h-16 bg-zinc-200 dark:bg-zinc-800 rounded-xl"></div>
                    <div class="h-16 bg-zinc-200 dark:bg-zinc-800 rounded-xl"></div>
                </div>
            </div>

            <div class="p-4 border-t border-zinc-200 dark:border-zinc-800">
                <button id="btn-new-note" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl transition-all transform active:scale-95 flex items-center justify-center gap-2 shadow-lg shadow-brand-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                    New Note
                </button>
                <button id="btn-logout" class="w-full mt-3 py-2 text-sm text-zinc-500 hover:text-red-500 transition-colors flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                    Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative">
            <!-- Editor Header -->
            <header id="editor-header" class="hidden h-16 border-b border-zinc-200 dark:border-zinc-800 flex items-center justify-between px-8 bg-white/80 dark:bg-zinc-950/80 backdrop-blur-md z-10">
                <div class="flex items-center gap-4">
                    <input type="text" id="note-title" class="bg-transparent font-bold text-xl outline-none focus:ring-0 placeholder-zinc-300 dark:placeholder-zinc-600 w-64" placeholder="Untitled Note">
                    <div id="note-tags-container" class="flex gap-2"></div>
                </div>
                <div class="flex items-center gap-3">
                    <span id="save-status" class="text-xs text-zinc-400 font-medium mr-2 italic">Saved</span>
                    <button id="btn-share" class="px-4 py-2 bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 rounded-lg text-sm font-medium transition-all flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C11.816 10.168 18.634 10.168 21.768 13.342m-13.342 0C6.684 6.168 13.502 6.168 16.636 9.342m-13.342 0l13.342 0m0 0l-1.342 1.342m0 0l1.342 1.342m-13.342 0l13.342 0" /></svg>
                        Share
                    </button>
                    <button id="btn-delete-note" class="p-2 text-zinc-400 hover:text-red-500 rounded-lg transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 15m5-10v10m-5-10h10a2 2 0 012 2v10a2 2 0 01-2 2h-10a2 2 0 01-2-2v-10a2 2 0 012-2z" /></svg>
                    </button>
                </div>
            </header>

            <!-- Content Area -->
            <div id="editor-container" class="flex-1 overflow-y-auto p-8 md:p-16 lg:px-32 bg-white dark:bg-zinc-950 transition-all duration-500">
                <div id="empty-editor" class="h-full flex flex-col items-center justify-center text-center text-zinc-400 space-y-4">
                    <div class="w-20 h-20 bg-zinc-100 dark:bg-zinc-900 rounded-full flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.447 9.246 5 7.5 5S4.168 5.447 3 6.253v13C4.168 18.447 5.754 18 7.5 18s3.332.447 4.5 1.253m0-13C13.168 5.447 14.754 5 16.5 5s3.332.447 4.5 1.253v13C19.832 18.447 18.246 18 16.5 18c-1.746.447-3.332.847-4.5 1.253" /></svg>
                    </div>
                    <p class="text-lg font-medium">Select a note or create a new one to start writing</p>
                </div>
                <textarea id="note-body" class="hidden w-full h-full resize-none bg-transparent outline-none text-lg leading-relaxed placeholder-zinc-300 dark:placeholder-zinc-600" placeholder="Start typing your thoughts..."></textarea>
            </div>
        </main>
    </div>

    <!-- Share View / PIN View -->
    <div id="share-view" class="hidden min-h-screen flex items-center justify-center p-4 bg-zinc-50 dark:bg-zinc-950">
        <div id="pin-overlay" class="w-full max-w-md bg-white dark:bg-zinc-900 rounded-3xl shadow-xl p-8 border border-zinc-200 dark:border-zinc-800 text-center">
            <h2 class="text-2xl font-bold mb-4">Protected Note</h2>
            <p class="text-zinc-500 dark:text-zinc-400 mb-6">Please enter the PIN to access this note.</p>
            <div class="flex justify-center gap-3 mb-8">
                <input type="password" id="pin-input" maxlength="4" class="w-32 text-center text-3xl tracking-widest px-4 py-3 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-transparent outline-none focus:ring-2 focus:ring-brand-500" placeholder="****">
            </div>
            <button id="btn-verify-pin" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl transition-all transform active:scale-95">Verify PIN</button>
        </div>
        <div id="shared-note-content" class="hidden w-full max-w-3xl bg-white dark:bg-zinc-900 rounded-3xl shadow-xl p-12 border border-zinc-200 dark:border-zinc-800 overflow-y-auto max-h-[80vh]">
            <div class="flex justify-between items-start mb-8">
                <h1 id="shared-title" class="text-3xl font-bold"></h1>
                <span class="px-3 py-1 bg-brand-100 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400 text-xs font-bold rounded-full uppercase tracking-wider">Read Only</span>
            </div>
            <div id="shared-body" class="text-lg leading-relaxed text-zinc-700 dark:text-zinc-300 whitespace-pre-wrap"></div>
        </div>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div id="modal-content" class="bg-white dark:bg-zinc-900 rounded-3xl shadow-2xl p-8 max-w-md w-full border border-zinc-200 dark:border-zinc-800 transform transition-all scale-95 opacity-0">
            <!-- Content injected via JS -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="db.js"></script>
    <script src="app.js"></script>
</body>
</html>
